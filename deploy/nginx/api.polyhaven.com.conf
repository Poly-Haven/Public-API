# nginx site for an api node. Installed by deploy/provision.sh to /etc/nginx/sites-available/api.polyhaven.com.
#
# nginx is only a reverse proxy here. There is deliberately NO proxy_cache: the old one held a URL for up to 12h
# and nothing could purge it, so edits and publishes served stale (see info/api_nginx_proxy_cache_removal.md).
# Cache only where it can be purged: Cloudflare, and the app's own in-memory data.
#
# Cloudflare reaches the node over plain HTTP on port 80 (zone SSL mode is Flexible), so there is no 443 listener.
# Admin's /clear_cache fan-out also calls http://<node ip>/clear_cache, with the IP as the Host header, which is
# why this is the default_server: without it that request would fall through to some other site.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name api.polyhaven.com;

    # Who the client is. The app trusts CF-Connecting-IP (rate limits, per-key IP counts, failed-key limits), but
    # ports 80 and 443 are open to the whole internet, so anyone could send that header themselves and pick
    # their own identity. So nginx decides: only a connection that comes from a Cloudflare address (the ranges
    # in cloudflare-ips.conf, written by deploy/nginx/refresh-cloudflare-ips.sh) may supply it, and $remote_addr
    # becomes that header's value. Any other connection keeps its real socket address, and the proxy_set_header
    # lines below overwrite whatever headers it sent with $remote_addr, so the app only ever sees a header
    # nginx wrote itself. real_ip_recursive stays off (the default): CF-Connecting-IP is a single address.
    include /etc/nginx/cloudflare-ips.conf;
    real_ip_header CF-Connecting-IP;

    # Nothing legitimate posts more than a webhook body or a small JSON document. Rejecting early keeps junk
    # away from the single Node worker.
    client_max_body_size 1m;

    location / {
        # MUST stay the literal 127.0.0.1, never "localhost". localhost resolves to ::1 and 127.0.0.1, so nginx
        # treats it as two upstreams, and one refused connection (the instant a pm2 reload swaps workers) marks
        # both failed for 10s: that was 10s of 502s on every deploy. The app listens on :: so 127.0.0.1 works.
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        # See the realip block above: always nginx's own view of the client, never what the request claimed.
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;

        # Fail fast if the app is down rather than holding the connection for the 60s default.
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        # Some multi-category /assets queries ran past 60s on the old nodes and hit the default. Cloudflare gives
        # up on the origin at 100s anyway, so there is no point waiting longer than this.
        proxy_read_timeout 90s;
    }
}
