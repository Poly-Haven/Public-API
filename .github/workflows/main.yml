name: Deploy

on:
  push:
    branches: [master]

  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # keep equal to NODE_MAJOR in deploy/provision.sh
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  deploy:
    needs: test
    runs-on: ubuntu-latest

    # Auth: SSH_KEY is a dedicated ed25519 deploy key whose public half is in ~api/.ssh/authorized_keys on each node
    # (the nodes accept keys only). Required secrets: SSH_HOST_API_A, SSH_HOST_API_B, SSH_USERNAME, SSH_KEY.
    #
    # Host key pinning: SSH_FINGERPRINT_API_A / SSH_FINGERPRINT_API_B hold each node's SHA256 host key fingerprint,
    # and the action refuses to connect to anything else. Re-set them whenever a node is rebuilt.
    #
    # Nodes go one after the other. set -e aborts on the first failing command (deploy.sh fails unless /ping reports
    # the new commit), and a failed step skips the next node, so a bad deploy never takes both nodes down.
    steps:
      - name: Deploy API A
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_HOST_API_A }}
          fingerprint: ${{ secrets.SSH_FINGERPRINT_API_A }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -euo pipefail
            cd ~/api
            git pull --ff-only
            bash deploy.sh
      - name: Deploy API B
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_HOST_API_B }}
          fingerprint: ${{ secrets.SSH_FINGERPRINT_API_B }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -euo pipefail
            cd ~/api
            git pull --ff-only
            bash deploy.sh
